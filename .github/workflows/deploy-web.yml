name: deploy-web

# Flutter Web (PWA) → Cloudflare Pages (BC-3).
# Builds on every push to main (and PRs) that touches the mobile tree. On
# push-to-main it also deploys to Cloudflare Pages — but only once the
# CLOUDFLARE_API_TOKEN secret exists (BC-4). Until then the deploy step is
# skipped so the workflow stays green.
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/deploy-web.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/deploy-web.yml'

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: build flutter web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    # Surface the secret as an env var so the deploy step can be conditionally
    # skipped when it is not configured (step-level `if` cannot read secrets
    # directly).
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned to the same Flutter release the rest of CI uses (see mobile.yml)
      # so the web bundle is reproducible against the analyzer/test toolchain.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.5
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-${{ hashFiles(''mobile/pubspec.lock'') }}'

      - name: Resolve packages
        run: flutter pub get

      # CanvasKit is the default web renderer (--web-renderer removed in 3.29+).
      # FLAVOR marks the bundle as production for any --dart-define-gated paths.
      # web/_redirects and web/_headers are copied into build/web automatically.
      - name: Build web
        run: flutter build web --release --dart-define=FLAVOR=production

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: mobile/build/web/
          retention-days: 7

      # Deploy only on push-to-main and only when the token is configured (BC-4).
      # wrangler-action runs from the repo root; workingDirectory scopes it to
      # mobile so the build path below is relative to that.
      - name: Deploy to Cloudflare Pages
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          env.CF_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: mobile
          command: pages deploy build/web --project-name=book-club-web --branch=main
