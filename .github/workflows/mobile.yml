name: mobile

# Scope to mobile-only concerns: mobile/ tree or this workflow file.
# Backend-only PRs should not spin up Flutter.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  analyze-and-test:
    name: analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned Flutter version (stable channel, 3.41.5) for reproducible
      # analyzer / test output. `cache: true` uses mobile/pubspec.lock as
      # the cache key so package-set changes bust cleanly.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.5
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-${{ hashFiles(''mobile/pubspec.lock'') }}'

      - name: Resolve packages
        run: flutter pub get

      - name: dart format --set-exit-if-changed
        run: dart format --set-exit-if-changed .

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

  build-android:
    name: build android (release apk)
    runs-on: ubuntu-latest
    # Gate the build behind analyze & test so we don't burn runner time
    # compiling a tree that already fails the cheap checks.
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.5
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-${{ hashFiles(''mobile/pubspec.lock'') }}'

      - name: Resolve packages
        run: flutter pub get

      # Release build without signing config / dart-defines: this verifies the
      # release toolchain compiles. Store secrets (Sentry/RevenueCat keys,
      # signing) are injected only in the publish pipeline (M60), not here.
      - name: flutter build apk --release
        run: flutter build apk --release

  build-ios:
    name: build ios (no codesign)
    runs-on: macos-latest
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.5
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-${{ hashFiles(''mobile/pubspec.lock'') }}'

      - name: Resolve packages
        run: flutter pub get

      # --no-codesign compiles the iOS app without provisioning profiles /
      # certificates, which CI does not hold. Signing + TestFlight upload is a
      # separate M60 release job that runs with the Apple credentials.
      - name: flutter build ios --no-codesign --release
        run: flutter build ios --no-codesign --release
