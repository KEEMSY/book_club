name: mobile

# Scope to mobile-only concerns: mobile/ tree or this workflow file.
# Backend-only PRs should not spin up Flutter.
#
# Trigger split (BC-7):
#   - PRs run the cheap verification builds (apk / ios --no-codesign) so a broken
#     release toolchain is caught before merge without producing artifacts.
#   - push-to-main runs the release-artifact builds (Android AAB / iOS archive)
#     and uploads them. Signing + store upload is layered on separately (BC-8/9).
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  analyze-and-test:
    name: analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned Flutter version (stable channel, 3.41.5) for reproducible
      # analyzer / test output. `cache: true` uses mobile/pubspec.lock as
      # the cache key so package-set changes bust cleanly.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.5
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-${{ hashFiles(''mobile/pubspec.lock'') }}'

      - name: Resolve packages
        run: flutter pub get

      - name: dart format --set-exit-if-changed
        run: dart format --set-exit-if-changed .

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

  build-android:
    name: build android (release apk)
    runs-on: ubuntu-latest
    # PR-only verification: compile the release toolchain without producing a
    # store artifact. The AAB release build runs on push-to-main instead.
    if: github.event_name == 'pull_request'
    # Gate the build behind analyze & test so we don't burn runner time
    # compiling a tree that already fails the cheap checks.
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.5
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-${{ hashFiles(''mobile/pubspec.lock'') }}'

      - name: Resolve packages
        run: flutter pub get

      # Release build without signing config / dart-defines: this verifies the
      # release toolchain compiles. Store secrets (Sentry/RevenueCat keys,
      # signing) are injected only in the publish pipeline, not here.
      - name: flutter build apk --release
        run: flutter build apk --release

  build-ios:
    name: build ios (no codesign)
    runs-on: macos-latest
    if: github.event_name == 'pull_request'
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.5
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-${{ hashFiles(''mobile/pubspec.lock'') }}'

      - name: Resolve packages
        run: flutter pub get

      # --no-codesign compiles the iOS app without provisioning profiles /
      # certificates, which PR CI does not hold. Signing + TestFlight upload is
      # a separate release job that runs with the Apple credentials (BC-9).
      - name: flutter build ios --no-codesign --release
        run: flutter build ios --no-codesign --release

  release-android:
    name: release android (aab)
    runs-on: ubuntu-latest
    # Store-format artifact build. Runs only on push-to-main so every merged
    # change yields a downloadable AAB with a monotonically increasing build
    # number (Play requires unique build numbers per upload).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: analyze-and-test
    # Secrets are surfaced as env so step-level `if` can gate on their presence
    # (a step `if` cannot read `secrets.*` directly). When the signing secret is
    # absent the build still runs (debug-signed, per build.gradle.kts fallback)
    # and the Play upload is skipped, so CI stays green before BC-10 injects them.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.5
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-${{ hashFiles(''mobile/pubspec.lock'') }}'

      - name: Resolve packages
        run: flutter pub get

      # Decode the upload keystore from the base64 secret and point the Gradle
      # release signingConfig at it via KEYSTORE_PATH (read in build.gradle.kts).
      # Skipped when unset → Gradle falls back to debug signing.
      - name: Decode signing keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      # version name comes from pubspec.yaml; the build number is the CI run
      # number so each merged build is uniquely identifiable and store-uploadable.
      - name: flutter build appbundle --release
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: mobile/build/app/outputs/bundle/release/*.aab
          retention-days: 14

      # Upload to the Play internal test track only when BOTH the signing key and
      # the service account exist — Play rejects a debug-signed AAB, so uploading
      # an unsigned build would just fail. Requires the app to already exist in
      # Play Console with one manual upload (API cannot create the first version).
      - name: Upload to Play internal track
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: kr.missiondriven.bookclub
          releaseFiles: mobile/build/app/outputs/bundle/release/*.aab
          track: internal
          status: completed

  release-ios:
    name: release ios (archive)
    runs-on: macos-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: analyze-and-test
    # Signing secrets surfaced as env so step `if` can gate on their presence.
    # Absent → the job falls back to the unsigned archive (prior behavior) and
    # skips TestFlight, keeping CI green until BC-10 injects the credentials.
    env:
      IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.5
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-${{ hashFiles(''mobile/pubspec.lock'') }}'

      - name: Resolve packages
        run: flutter pub get

      # ---- Unsigned fallback: no Apple credentials configured ----
      # --no-codesign produces an unsigned .xcarchive to validate that the
      # release build compiles on main. Store upload needs the signed path below.
      - name: flutter build ipa --no-codesign --release
        if: env.IOS_DIST_CERT_BASE64 == ''
        run: flutter build ipa --no-codesign --release --build-number=${{ github.run_number }}

      - name: Upload iOS archive artifact
        if: env.IOS_DIST_CERT_BASE64 == ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ios-archive
          path: mobile/build/ios/archive/*.xcarchive
          retention-days: 14
          if-no-files-found: warn

      # ---- Signed path: Apple credentials configured (BC-9) ----
      # Imports the distribution cert into a temporary keychain.
      - name: Import signing certificate
        if: env.IOS_DIST_CERT_BASE64 != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      - name: Install provisioning profile
        if: env.IOS_DIST_CERT_BASE64 != ''
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_DIR/dist.mobileprovision"

      # Manual signing needs an explicit export map (team + profile per bundle id).
      # Generated here from secrets so the plist isn't committed with a real team id.
      - name: Write ExportOptions.plist
        if: env.IOS_DIST_CERT_BASE64 != ''
        run: |
          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>kr.missiondriven.bookclub</key><string>${IOS_PROVISIONING_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: flutter build ipa --release (signed)
        if: env.IOS_DIST_CERT_BASE64 != ''
        run: flutter build ipa --release --build-number=${{ github.run_number }} --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA artifact
        if: env.IOS_DIST_CERT_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: mobile/build/ios/ipa/*.ipa
          retention-days: 14
          if-no-files-found: warn

      # Upload to TestFlight via App Store Connect API key (issuer + key id +
      # raw .p8 contents). Gated additionally on the API key so a signed-but-not-
      # uploadable config still produces the IPA artifact without failing.
      - name: Upload to TestFlight
        if: env.IOS_DIST_CERT_BASE64 != '' && env.APP_STORE_CONNECT_API_PRIVATE_KEY != ''
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: mobile/build/ios/ipa/*.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
