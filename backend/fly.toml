# Fly.io app config — Book Club backend (FastAPI).
#
# This is a minimal stub for the M58 deploy pipeline. The production app
# (regions, scaling, machine sizing, R2 / Sentry wiring) is finalised in M59.
# Secrets are NEVER stored here — they live in Fly.io secrets (see
# docs/ops/fly-secrets.md). Rename `app` to the real Fly app before first deploy.

app = "book-club-api"
primary_region = "nrt"  # Tokyo — closest to the Korean user base.

[build]
  # Build context is this directory (backend/), so the multi-stage Dockerfile's
  # relative COPYs (pyproject.toml, app/, migrations/) resolve correctly.
  dockerfile = "Dockerfile"
  # Reuse the lean, non-root runtime stage rather than the dev/live-reload one.
  build-target = "production"

# Alembic runs once per release, before the new machines take traffic. Keeping
# migrations out of the GitHub Actions workflow means schema changes apply in
# the same network/secret context as the app itself.
[deploy]
  release_command = "alembic upgrade head"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.checks]
    [http_service.checks.health]
      method = "get"
      path = "/health"
      interval = "15s"
      timeout = "5s"
      grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
