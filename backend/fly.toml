# Fly.io app config — Book Club backend (FastAPI).
#
# Production config (M59). Regions, scaling, machine sizing, and health checks
# are finalised here; R2 / Sentry / DB credentials are injected as Fly secrets
# (see docs/ops/fly-secrets.md) and NEVER stored in this file. First-time deploy
# steps live in docs/ops/deployment-runbook.md.

app = "book-club-api"
primary_region = "nrt"  # Tokyo — closest to the Korean user base.

[build]
  # Build context is this directory (backend/), so the multi-stage Dockerfile's
  # relative COPYs (pyproject.toml, app/, migrations/) resolve correctly.
  dockerfile = "Dockerfile"
  # Reuse the lean, non-root runtime stage rather than the dev/live-reload one.
  build-target = "production"

# Alembic runs once per release, before the new machines take traffic. Keeping
# migrations out of the GitHub Actions workflow means schema changes apply in
# the same network/secret context as the app itself.
[deploy]
  release_command = "alembic upgrade head"

[env]
  PORT = "8000"
  # App is installed at /app and imported as the `app` package; make that
  # explicit so a thin runtime image without an editable install still resolves.
  PYTHONPATH = "/app"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.checks]
    # Routing check uses the readiness probe so a machine only takes traffic once
    # its DB connection is live. grace_period covers cold start + connection-pool
    # warmup; the release_command runs migrations before machines boot, so the
    # schema is already current by the time this first fires.
    [http_service.checks.health]
      method = "get"
      path = "/health/ready"
      interval = "15s"
      timeout = "5s"
      grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
