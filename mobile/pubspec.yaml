name: book_club
description: "Book Club mobile app (Flutter)."
publish_to: 'none'

version: 0.1.1+2

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Localization delegates (M72 · i18n). Bundles the Material/Cupertino/Widgets
  # localizations for ko/en/ja so date pickers, dialogs, and tooltips render in
  # the active locale. Pairs with the `generate: true` flag below, which runs
  # `gen-l10n` over lib/l10n/*.arb on `flutter pub get`.
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Models / serialization annotations
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # HTTP
  dio: ^5.7.0
  # retrofit_generator 9.x (source_gen ^2, riverpod_generator 2.x compatible) does not
  # handle Parser.DartMappable added in retrofit 4.9.0. Cap at ^4.8.0 until
  # riverpod_generator migrates to 3.x which allows retrofit_generator 10.x.
  retrofit: ^4.8.0

  # Secure storage (JWT)
  flutter_secure_storage: ^9.2.4

  # Social login SDKs (M1 · auth). Kakao SDK user module covers OAuth login
  # via KakaoTalk + fallback web account flow. Apple SDK covers iOS native
  # Sign in with Apple (Android hidden — backend route still exists but UI
  # button is iOS-only).
  kakao_flutter_sdk_user: ^1.9.7
  sign_in_with_apple: ^6.1.4

  # i18n / formatting. Pinned to ^0.20.2 because flutter_localizations (Flutter
  # 3.41 SDK) hard-pins intl to 0.20.2 — an older constraint fails resolution.
  intl: ^0.20.2

  # Typography — Airbnb design system. Cereal VF is proprietary, so we
  # substitute with two google_fonts families tuned for a Korean 20–30대 여성
  # reading-app audience: Playfair Display (editorial serif — hero / display
  # roles) and Inter (humanist sans — UI / body). Fonts are fetched at runtime.
  google_fonts: ^6.2.1

  # Remote book cover loading (M2 · book feature). Network image cache +
  # progressive placeholder on top of dio. The Book Club backend returns
  # `cover_url` from Naver/Kakao directly, so we need HTTP range-friendly
  # cached images with graceful fallbacks when a book record has no cover.
  cached_network_image: ^3.4.1

  # Rating stars (M2 · review modal). Chosen over rolling a custom star row
  # because the package renders cleanly inside our Airbnb-toned modal and
  # lets us swap the empty/filled colors to Rausch without losing haptics.
  flutter_rating_bar: ^4.0.1

  # Android foreground service host for the reading timer (M3 · Task 3.11).
  # Registers the "독서 중" persistent notification so Android doesn't kill the
  # Dart isolate while the user is reading outside the app. iOS uses the
  # wall-clock resume-recompute path instead (see `timer_notifier.dart`).
  flutter_background_service: ^5.1.0

  # Image attach (M4 · Task 4.8). Used by the post composer to pull photos
  # from the gallery; works on iOS, Android, and Chrome web (returns XFile).
  # The presigned PUT step ingests the bytes via XFile.readAsBytes() so we
  # don't depend on dart:io paths.
  image_picker: ^1.1.2

  # Dashboard section visibility prefs (M3 · Feature 2). Persists the user's
  # show/hide toggle for Streak / Goal / Grade / Heatmap sections across
  # cold restarts. Tiny footprint — no native channel beyond the plugin.
  shared_preferences: ^2.3.0
  share_plus: ^12.0.2
  # Deep-link QR rendered on M62 SNS share cards. Encodes
  # bookclub.app/join?ref=<code> so a shared card is a referral entry point.
  qr_flutter: ^4.1.0
  flutter_svg: ^2.3.0
  web_socket_channel: ^3.0.3
  firebase_messaging: ^16.3.0

  # Privacy Policy / external links (M40 · store submission).
  url_launcher: ^6.3.1

  # Error monitoring (M50). DSN injected via --dart-define=SENTRY_DSN at build
  # time; omitting the define disables Sentry entirely so local dev stays clean.
  sentry_flutter: ^8.0.0

  # Connectivity monitoring (M55). Drives the global "오프라인" banner so users
  # understand why content stops loading when the device drops its connection.
  connectivity_plus: ^6.1.0

  # In-app review prompt (M61). Wraps StoreKit SKStoreReviewController on iOS
  # and the Play In-App Review API on Android — both surface the native rating
  # sheet without leaving the app. The OS rate-limits how often the sheet shows,
  # so InAppReviewService gates requests on top (5-session trigger, daily cap,
  # 3-requests-per-install ceiling) to avoid wasting the OS quota on bad moments.
  in_app_review: ^2.0.9

  # In-app purchases (M56). RevenueCat wraps StoreKit / Play Billing and
  # validates receipts server-side; the API key is injected via
  # --dart-define=REVENUECAT_API_KEY and omitted in dev (paywall falls back to
  # the backend test-receipt path when unconfigured).
  purchases_flutter: ^10.3.0

  # Device location for nearby-events discovery (M66). Centers the "근처 모임"
  # search on the user's GPS position when permission is granted; falls back to
  # Seoul City Hall when denied or when location services are off.
  geolocator: ^13.0.2

  # On-device text-to-speech for the AI audio reading coach (M67). Speaks the
  # Claude-generated intro script in-app; no external TTS API is used.
  flutter_tts: ^4.2.0

  # Real-time video for reading-club calls (M71). The backend issues the join
  # token (channel + uid) and the App ID is injected via
  # --dart-define=AGORA_APP_ID; omitting it makes VideoSessionScreen fall back to
  # the static placeholder grid so dev/test stay buildable without an account.
  agora_rtc_engine: ^6.3.2

  # Kakao Map for the nearby-events map view (M71). App key is injected via
  # --dart-define=KAKAO_MAP_KEY (same app as kakao_flutter_sdk_user); omitting it
  # leaves the map empty rather than crashing. 0.3.x is the latest published line
  # (the plan's ^2.1.1 does not exist on pub.dev) — a webview-backed wrapper.
  kakao_map_plugin: ^0.3.7

  # Camera/mic runtime permissions for the Agora call (M71). Agora needs these
  # granted before joinChannel; geolocator covers only location.
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Lets InAppReviewService tests swap the platform interface with a fake
  # (InAppReview itself has a private constructor). Test-only — not linked into
  # the app binary, which depends on in_app_review (the wrapper) directly.
  in_app_review_platform_interface: ^2.0.5

  # Code generation
  build_runner: ^2.4.13
  freezed: ^3.1.0
  json_serializable: ^6.9.0
  retrofit_generator: ^9.7.0
  riverpod_generator: ^2.6.3

  # App store submission assets (M57). Generators only — not linked into the
  # app binary. flutter_launcher_icons stamps the launcher/adaptive icons,
  # flutter_native_splash writes the native splash resources. Run manually via
  # `dart run flutter_launcher_icons` / `dart run flutter_native_splash:create`
  # once the source PNGs land in assets/icon/ (see assets/icon/README.md).
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.0

  # Lint plugins (Riverpod-aware)
  # riverpod_lint 3.x requires riverpod_generator 4.x / flutter_riverpod 3.x —
  # upgrade together as a separate step after the Riverpod 2→3 migration.
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

# analyzer_plugin 0.13.x fixes the Element2 namespace split that 0.12.0
# exposed against analyzer 7.6. Remove once custom_lint/riverpod_lint include
# a compatible version as a direct constraint.
dependency_overrides:
  analyzer_plugin: ^0.13.0

flutter:
  uses-material-design: true

  # Generate AppLocalizations from lib/l10n/*.arb on `flutter pub get` (M72).
  # Configuration lives in l10n.yaml at the package root.
  generate: true

  fonts:
    # Noto Sans KR variable font — bundled as an asset so all weights (w100–w900)
    # are available on Flutter Web without a network round-trip to fonts.gstatic.com.
    # Variable fonts use the 'wght' axis, so any fontWeight value maps correctly.
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-VF.ttf

  assets:
    - assets/fonts/
    - assets/illustrations/
    - assets/legal/
