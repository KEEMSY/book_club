<!DOCTYPE html>
<html>
<head>
  <!--
    base href is rewritten by `flutter build web --base-href`. It must start
    and end with a slash; the default placeholder resolves to the site root.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="독서를 함께하는 스마트한 방법">

  <!-- PWA / iOS home-screen install -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="북클럽">
  <meta name="theme-color" content="#FF6B6B">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>북클럽</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    flutter_bootstrap.js is the supported entrypoint as of Flutter 3.22+; it
    injects the build-time service-worker version and loads the engine. We keep
    the default loader rather than the legacy `_flutter.loader.loadEntrypoint`
    shim, which was removed in newer Flutter releases.
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
