include: package:flutter_lints/flutter.yaml

analyzer:
  # custom_lint (riverpod_lint) is intentionally NOT wired as an analyzer plugin
  # here: as an analyzer-server plugin it makes `flutter analyze` non-deterministic
  # — it surfaces a flaky subset of its INFO advisories and fails the CI gate at
  # random (BC-102). The packages stay as dev_dependencies, so custom_lint can be
  # run deliberately via `dart run custom_lint`. Re-introducing it as a dedicated,
  # non-flaky CI step (after clearing the existing INFO backlog) is tracked as a
  # follow-up.
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    prefer_const_constructors: true
    prefer_final_locals: true
    # require_trailing_commas removed: the pinned dart formatter (Flutter 3.41.5)
    # manages commas and its output conflicts with this lint, making it
    # impossible to satisfy both `dart format --set-exit-if-changed` and analyze.
    avoid_print: true
