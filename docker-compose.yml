# Book Club — local development stack.
#
# Services: api (FastAPI) · db (Postgres 16) · redis (Redis 7) · minio (R2 stand-in)
# Plus `minio-init` which bootstraps the dev bucket then exits.
#
# Conventions:
#   • Pinned versions on data stores (postgres:16-alpine, redis:7-alpine).
#     MinIO publishes rolling `:latest` only (no stable major tag) — see comment
#     on the minio service.
#   • Every service has a healthcheck; `api.depends_on` uses condition:
#     service_healthy so the API never starts against an unready backing store.
#   • Named volumes are prefixed `bookclub_` to avoid clashes with other
#     projects on the same dev machine.

# Default (shared) project name. An isolated per-worktree stack overrides this
# with `docker compose -p bookclub-<ticket>` (the -p flag has highest precedence)
# so its containers/volumes/network never touch another session's. See
# scripts/worktree-stack.sh and CLAUDE.md §6.4.
name: bookclub

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    image: bookclub-api:dev
    env_file:
      - .env
    environment:
      # Compose-scope overrides of the hosts so this file works even if a dev
      # accidentally left a localhost URL in .env.
      DATABASE_URL: postgresql+asyncpg://bookclub:bookclub@db:5432/bookclub
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:${MINIO_API_PORT:-9000}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Bind-mount source for live reload. .venv is kept inside the image so
      # the host's Python/venv doesn't shadow it.
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/pyproject.toml:/app/pyproject.toml
      - ./backend/uv.lock:/app/uv.lock
      - ./backend/tests:/app/tests
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # start_period gives the server time to import all modules before the
      # first health probe. Keeps unhealthy false-positives during cold start.
      start_period: 30s
    # on-failure (not unless-stopped) so Docker restarts on non-zero exit but
    # respects explicit `docker stop`. max_attempts caps infinite crash loops.
    restart: on-failure:5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bookclub
      POSTGRES_PASSWORD: bookclub
      POSTGRES_DB: bookclub
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookclub -d bookclub"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    # MinIO only publishes rolling tags; pin to a known-good SHA in production
    # infra. `:latest` is acceptable for local dev — reproducibility of the
    # dev stack is not a compliance requirement here.
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_API_PORT:-9000}:9000"       # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio-init:
    # One-shot bootstrap: create the dev bucket then exit. Safe to re-run —
    # `mb --ignore-existing` makes it idempotent.
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      S3_BUCKET: bookclub-dev
    entrypoint: >
      /bin/sh -c "
        set -e;
        mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\";
        mc mb --ignore-existing local/\"$$S3_BUCKET\";
        mc anonymous set public local/\"$$S3_BUCKET\" || true;
        echo 'bucket ready: '\"$$S3_BUCKET\";
      "
    restart: "no"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "${PROM_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus:/etc/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./infra/grafana:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  # No fixed `name:` so Compose namespaces each volume per project
  # (<project>_postgres_data). The default `bookclub` project keeps the same
  # auto-name it had before (bookclub_postgres_data) — existing data is
  # preserved — while isolated per-worktree stacks get their own volumes.
  postgres_data:
  minio_data:
  grafana_data:

# Default bridge network is created automatically as `bookclub_default`.
